# Production compose for mkserver, deployed by Dokploy (app webchat-webchat-e7zst7)
# on every push to master. Env vars come from the Dokploy Environment tab (.env).
#
# Nginx Proxy Manager forwards webchat.megakontroll.com.br to the container by
# name on the mkserver-shared network, so there is no host port and the
# container_name must stay as is.
#
# Running somewhere else? Drop container_name/networks, add `ports: ["8080:8080"]`
# and point the volume at ./data.
services:
  webchat:
    build: .
    container_name: webchat-server-webchat-1
    restart: unless-stopped
    env_file: .env
    environment:
      # HH:MM values (reminders, retention sweep) use the container's clock.
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      # Prod SQLite DB (+ WAL), kept where the pre-Dokploy deploy left it.
      - /opt/whatsapp-ui/webchat-server/data:/app/data
    networks: [mkserver-shared]

networks:
  mkserver-shared:
    external: true
